# ---------------------------------------------------------------------------
# [project] -- the metadata a package manager reads.  Standardised by PEP 621,
# so every tool (pip, uv, poetry, hatch) understands this exact table.
# ---------------------------------------------------------------------------
[project]
name = "minicodex-live"
# The live deployment forked from tutorial step 23; the version starts its own
# line there.  The import package stays `minicodex` and so does the entry
# point, so every script, test and doc that names it keeps working.
version = "0.1.0"
description = "A Codex-like coding agent, built from scratch, one failure at a time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # The first runtime dependency of the project.  Chapter -1 had none; talking
    # to a model over HTTP is what finally justified one.
    "httpx>=0.27",
    # The second, arrived by deleting code rather than adding it -- Chapter 9's
    # decision, inherited here rather than repeated: hand-roll what you are
    # teaching, depend on what you are not. codex depends on its own official
    # SDK too (`rmcp = "=3.0.0"`, `codex-rs/Cargo.toml:393`).
    "mcp>=2.1",
    # `mcp`'s own HTTP stack, and a *direct* dependency rather than only a
    # transitive one: this chapter's `remote.py` builds `httpx2.AsyncClient`
    # instances itself, to carry headers and OAuth onto a connection the SDK's
    # `streamable_http_client` does not accept either of directly (measured
    # with `inspect.signature`, not assumed -- see `remote.py`).
    "httpx2>=2.5",
]

# Installed only when asked for: `uv sync --all-extras` or `pip install '.[dev]'`.
# Users of the package do not get, and do not need, the test runner.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyyaml>=6.0",
    # Environment marker: tomllib entered the stdlib in 3.11, so only older
    # interpreters need the backport.  One dependency list, every Python.
    "tomli>=2.0; python_version < '3.11'",
]

# Chapter 19.  An extra rather than a runtime dependency because the agent runs
# perfectly well without a browser attached, and `fastapi` + `uvicorn` pull in
# roughly forty packages to serve one page.  `uv sync --all-extras` (what CI
# runs) installs it; `pip install minicodex` still gets an agent and a CLI.
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
]

# Creates an executable called `minicodex` that calls minicodex.__main__.main().
[project.scripts]
minicodex = "minicodex.__main__:main"

# ---------------------------------------------------------------------------
# [build-system] -- who turns this directory into an installable artefact.
# Omitting it means every tool silently falls back to setuptools, and the
# fallback is not identical across tools.  Say it out loud.
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# hatchling would infer this from src/minicodex, but an inferred build is one
# that changes when you rename a directory.  State it.
packages = ["src/minicodex"]

# ---------------------------------------------------------------------------
# ruff -- formatter and linter in one binary.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Chapter 14's eval workspaces. An A/B run leaves 36 directories of Python
# **written by the model**, inside the tree, and `ruff format --check .` walks
# them: 21 of the 23 files it wanted to reformat were the agent's homework.
# `.gitignore` does not help -- ruff only honours it inside a git repository,
# and a step directory here is not one. F14-08's shape at a smaller scale: an
# eval workspace that sits inside the system under test ends up inside the
# system under test's tooling.
extend-exclude = [".probe"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes: the classic errors
    "I",             # import sorting
    "UP",            # rewrite to modern syntax
    "B",             # bugbear: real bugs, not style
    "ASYNC",         # async footguns; nothing async yet, see chapter 0
    "RUF",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: a typo like @pytest.mark.slwo becomes an error instead of
# a decorator that silently does nothing.
addopts = "-q --strict-markers"
asyncio_mode = "auto"
# A forgotten `await` raises nothing and returns nothing: the coroutine is
# built, dropped, and its body never runs.  The only signal is a RuntimeWarning
# at garbage-collection time, invisible in a green run.  Promote it.
filterwarnings = ["error::RuntimeWarning"]
