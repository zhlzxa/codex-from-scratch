# Use together with compose.yaml. Schema changes are explicit deployment steps.
services:
  minicodex:
    environment:
      MINICODEX_DATABASE_URL: ${MINICODEX_DATABASE_URL:?Set the PostgreSQL URL in .env}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: minicodex
      POSTGRES_USER: minicodex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a PostgreSQL password in .env}
    volumes:
      - minicodex-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicodex -d minicodex"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No host port: only containers on the compose network can connect.

volumes:
  minicodex-postgres:
